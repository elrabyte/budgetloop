version: "3.9"

# Full BudgetLoop stack for local/dev use:
#   docker compose up --build
# - api:    Fastify + TypeScript + Prisma REST API, backed by a single SQLite file stored on the
#           `budgetloop-data` volume (see api/Dockerfile - migrations run automatically on start).
# - client: React SPA, served by nginx, proxies /api to the api service (see client/nginx.conf.template).
#
# No database container is needed - SQLite is just a file, which keeps this a simple 2-container
# stack. This is also a single-user, LAN-only app with no authentication: do not expose it
# directly to the internet.
#
# Do you need to configure anything first? No - every value below has a working default, so
# `docker compose up --build` runs as-is. Open http://localhost:8080 once it's up.
services:
  api:
    build:
      context: ./api
    restart: unless-stopped
    volumes:
      - budgetloop-data:/app/data
    ports:
      - "4000:4000"

  client:
    build:
      context: ./client
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  budgetloop-data:
